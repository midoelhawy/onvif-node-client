name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        run: |
          TGZ=$(npm pack --json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))[0].filename")
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          ls -la "$TGZ"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TGZ="${{ steps.pack.outputs.tgz }}"
          REPO="${{ github.repository }}"
          {
            echo "## onvif-node-client \`${TAG}\`"
            echo ""
            echo "Install (no token, no npm registry):"
            echo ""
            echo '```bash'
            echo "npm i https://github.com/${REPO}/releases/download/${TAG}/${TGZ}"
            echo '```'
            echo ""
            echo "Or from source (builds via prepare if needed):"
            echo ""
            echo '```bash'
            echo "npm i github:${REPO}#${TAG}"
            echo '```'
          } > /tmp/release-notes.md
          gh release create "$TAG" "$TGZ" \
            --title "$TAG" \
            --verify-tag \
            --notes-file /tmp/release-notes.md

      - name: Summary
        run: |
          TAG="${GITHUB_REF_NAME}"
          TGZ="${{ steps.pack.outputs.tgz }}"
          {
            echo "## Released \`$TAG\`"
            echo ""
            echo "Asset: \`$TGZ\`"
            echo ""
            echo '```bash'
            echo "npm i https://github.com/${{ github.repository }}/releases/download/${TAG}/${TGZ}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
