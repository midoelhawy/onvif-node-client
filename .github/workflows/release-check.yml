name: Release check

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Build tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack dry-run
        run: npm run pack:dry

      - name: Summary
        run: |
          VER=$(node -p "require('./package.json').version")
          {
            echo "## Tag \`v$VER\` ready"
            echo ""
            echo "Install without token:"
            echo ""
            echo '```bash'
            echo "npm i github:midoelhawy/onvif-node-client#v$VER"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
